[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepdocument"
version = "0.1.0"
description = "文献综述助手"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DeepDocument Team"}
]
dependencies = [
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
    "python-docx>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # Windows 用系统自带的 WebView2，不需要额外的 Qt 运行时
    "pywebview>=5.0.0; sys_platform == 'win32'",
    "pywebview[qt]>=5.0.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
deepdocument = "deepdocument.app:main"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
